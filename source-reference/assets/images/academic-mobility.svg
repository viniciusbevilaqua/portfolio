<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Academic Mobility System">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="100" fill="#6366f1" opacity="0.12"/>
  <!-- Browser window -->
  <rect x="120" y="60" width="560" height="360" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <rect x="120" y="60" width="560" height="36" rx="12" fill="#312e81"/>
  <rect x="120" y="84" width="560" height="12" fill="#312e81"/>
  <circle cx="144" cy="78" r="6" fill="#ef4444" opacity="0.7"/>
  <circle cx="164" cy="78" r="6" fill="#eab308" opacity="0.7"/>
  <circle cx="184" cy="78" r="6" fill="#22c55e" opacity="0.7"/>
  <!-- Content -->
  <rect x="150" y="120" width="200" height="16" rx="4" fill="#6366f1" opacity="0.8"/>
  <rect x="150" y="150" width="160" height="10" rx="3" fill="#818cf8" opacity="0.5"/>
  <rect x="150" y="170" width="180" height="10" rx="3" fill="#818cf8" opacity="0.4"/>
  <!-- Cards -->
  <rect x="150" y="210" width="150" height="100" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <rect x="165" y="230" width="80" height="8" rx="3" fill="#818cf8"/>
  <rect x="165" y="250" width="110" height="6" rx="2" fill="#6366f1" opacity="0.5"/>
  <rect x="165" y="265" width="90" height="6" rx="2" fill="#6366f1" opacity="0.3"/>
  <rect x="320" y="210" width="150" height="100" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
  <rect x="335" y="230" width="80" height="8" rx="3" fill="#818cf8"/>
  <rect x="335" y="250" width="110" height="6" rx="2" fill="#6366f1" opacity="0.5"/>
  <!-- Globe icon -->
  <circle cx="560" cy="180" r="40" fill="none" stroke="#818cf8" stroke-width="2"/>
  <ellipse cx="560" cy="180" rx="40" ry="16" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="520" y1="180" x2="600" y2="180" stroke="#818cf8" stroke-width="1.5"/>
  <text x="400" y="460" text-anchor="middle" fill="#e4e4e7" font-family="system-ui,sans-serif" font-size="22" font-weight="600">Academic Mobility System</text>
  <text x="400" y="488" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="14">HTML - CSS - JavaScript</text>
</svg>
