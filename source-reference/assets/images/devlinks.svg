  <rect x="250" y="70" width="300" height="360" rx="20" fill="#1e1035" stroke="#a78bfa" stroke-width="1.5" opacity="0.9"/>
  <!-- Avatar -->
  <circle cx="400" cy="160" r="45" fill="url(#avatar)"/>
  <text x="400" y="170" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="700">VB</text>
  <rect x="330" y="220" width="140" height="10" rx="4" fill="#a78bfa" opacity="0.7"/>
  <rect x="350" y="240" width="100" height="8" rx="3" fill="#8b5cf6" opacity="0.4"/>
  <!-- Link buttons -->
  <rect x="280" y="280" width="240" height="36" rx="8" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1"/>
  <rect x="295" y="292" width="80" height="8" rx="3" fill="#a78bfa" opacity="0.6"/>
  <rect x="280" y="330" width="240" height="36" rx="8" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1"/>
  <rect x="295" y="342" width="60" height="8" rx="3" fill="#a78bfa" opacity="0.6"/>
  <rect x="280" y="380" width="240" height="36" rx="8" fill="#2d1b69" stroke="#8b5cf6" stroke-width="1"/>
  <rect x="295" y="392" width="70" height="8" rx="3" fill="#a78bfa" opacity="0.6"/>
  <text x="400" y="470" text-anchor="middle" fill="#e4e4e7" font-family="system-ui,sans-serif" font-size="22" font-weight="600">DevLinks</text>
  <text x="400" y="498" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="14">HTML - CSS - JavaScript</text>
