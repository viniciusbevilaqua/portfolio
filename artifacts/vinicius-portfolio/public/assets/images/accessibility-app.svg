<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Accessibility App">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#1e1145"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="650" cy="100" r="120" fill="#8b5cf6" opacity="0.15"/>
  <circle cx="100" cy="400" r="80" fill="#a78bfa" opacity="0.1"/>
  <!-- Phone mockup -->
  <rect x="310" y="80" width="180" height="340" rx="24" fill="url(#phone)" stroke="#a78bfa" stroke-width="2"/>
  <rect x="325" y="110" width="150" height="260" rx="8" fill="#0a0a0f"/>
  <!-- Accessibility icon -->
  <circle cx="400" cy="200" r="30" fill="none" stroke="#8b5cf6" stroke-width="3"/>
  <circle cx="400" cy="188" r="8" fill="#8b5cf6"/>
  <path d="M370 230 Q400 210 430 230" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <line x1="385" y1="215" x2="370" y2="250" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <line x1="415" y1="215" x2="430" y2="250" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <!-- UI elements -->
  <rect x="340" y="260" width="120" height="8" rx="4" fill="#8b5cf6" opacity="0.6"/>
  <rect x="340" y="280" width="90" height="8" rx="4" fill="#6366f1" opacity="0.4"/>
  <rect x="340" y="300" width="100" height="8" rx="4" fill="#6366f1" opacity="0.4"/>
  <text x="400" y="430" text-anchor="middle" fill="#e4e4e7" font-family="system-ui,sans-serif" font-size="22" font-weight="600">Accessibility App</text>
  <text x="400" y="458" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="14">React Native - Expo - Firebase</text>
</svg>
